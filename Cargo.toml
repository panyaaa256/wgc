[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
wgc-core = { path = "crates/core" }
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
lz4_flex = { version = "0.14", default-features = false, features = ["safe-decode", "std"] }
xxhash-rust = { version = "0.8", features = ["xxh32"] }
tempfile = "3"
rayon = "1.12"
yaml-rust2 = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3.5"
nanonbt = { git = "https://github.com/TMCJapan/nanonbt", rev = "50ee11b581ac4790e594bff81ebe07d394f09891", default-features = false, features = ["alloc"] }
