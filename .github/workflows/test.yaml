name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with `rust-toolchain.toml`.
  RUST_TOOLCHAIN: 1.99.1

# Split from `clippy.yaml` so nextest gets its own runner and timeout budget
# instead of sharing a job with clippy.
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      # Keep the OS/target pairs in sync with the `clippy` matrix in
      # `clippy.yaml` and the `dist` matrix in `ci.yaml`.
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Keyed apart from `clippy` and `dist`: this job only ever fills the dev
      # profile, and a cache shared with the release build or the lint workflow
      # would thrash on every run.
      - name: Setup Rust toolchain and cache
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
          components: ""
          cache-key: test-${{ matrix.target }}

      # After the cache step on purpose: `rust-cache` restores `~/.cargo/bin`,
      # which is where `install-action` drops the binary.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run --workspace --all-targets --target ${{ matrix.target }}
