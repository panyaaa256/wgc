[package]
name = "wgc-fs"
description = "Host file system access for wgc, the Minecraft world chunk GC"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wgc-core.workspace = true
thiserror = { workspace = true, features = ["std"] }
rayon.workspace = true
yaml-rust2.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
wgc-core = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
flate2.workspace = true
