[package]
name = "wgc-cli"
description = "Delete unused chunks from Minecraft Java Edition worlds"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wgc"
path = "src/main.rs"
# The `wgc` library has the same name; only one of them can have API docs.
doc = false

[dependencies]
wgc-fs.workspace = true
clap.workspace = true
ctrlc.workspace = true
indicatif.workspace = true
console.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
flate2.workspace = true
