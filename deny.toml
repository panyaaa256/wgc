[advisories]
version = 2
# `paste` (unmaintained, not vulnerable) comes transitively via
# pulp <- nanocesu8 <- nanonbt. Revisit once upstream drops it.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
version = 2
# BSD-3-Clause: encoding_rs (via yaml-rust2). BSL-1.0: xxhash-rust.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "BSD-3-Clause", "BSL-1.0"]

[bans]
multiple-versions = "warn"

[sources]
allow-git = ["https://github.com/TMCJapan/nanonbt"]
